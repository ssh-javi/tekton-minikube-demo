apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  namespace: demo
  name: tekton-deployer

rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: tekton-deployer-binding
  namespace: demo

subjects:
  - kind: ServiceAccount
    name: default
    namespace: demo

roleRef:
  kind: Role
  name: tekton-deployer
  apiGroup: rbac.authorization.k8s.io
